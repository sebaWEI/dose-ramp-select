[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dose-ramp-select"
version = "0.1.0"
description = "Choose a transfection / assay dose from a luciferase (or similar) dose ramp using fold profiles and variance decomposition."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "iGEM PekingHSC" }]
keywords = ["dose", "transfection", "luciferase", "eta-squared", "variance", "iGEM"]
classifiers = [
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Intended Audience :: Science/Research",
  "Topic :: Scientific/Engineering :: Bio-Informatics",
]
dependencies = [
  "numpy>=1.24",
  "pandas>=2.0",
  "matplotlib>=3.7",
]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[project.scripts]
dose-ramp-select = "dose_ramp_select.cli:main"

[project.urls]
Homepage = "https://github.com/sebaWEI/dose-ramp-select"
Issues = "https://github.com/sebaWEI/dose-ramp-select/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
